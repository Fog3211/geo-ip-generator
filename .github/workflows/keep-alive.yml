name: Keep Render App Alive

on:
  schedule:
    # Run every 10 minutes. Render free tier sleeps after 15 min of inactivity,
    # and GitHub Actions scheduled jobs are often delayed by several minutes,
    # so we leave a ~5 min safety margin instead of the previous ~1 min.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Comma-separated list of URLs to ping (supports multiple Render services / custom domains)
      APP_URLS: ${{ secrets.RENDER_APP_URLS || vars.RENDER_APP_URLS || secrets.RENDER_APP_URL || 'https://ipregion.onrender.com' }}
    steps:
      - name: Show target URLs
        run: |
          echo "Targets: $APP_URLS"

      - name: Ping all targets with retry
        run: |
          IFS=',' read -ra URLS <<< "$APP_URLS"
          UA="GeoIP-KeepAlive/1.0 (GitHub Actions)"
          OK_COUNT=0
          for raw in "${URLS[@]}"; do
            url=$(echo "$raw" | xargs)
            if [ -z "$url" ]; then continue; fi
            echo "\n=== Pinging $url ==="
            # homepage. Use --max-time 60 so a cold-start (which can take 30-60s) does not time out at the default 0s.
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -H "User-Agent: $UA" -H "Cache-Control: no-cache" "$url" || echo "000")
              echo "Attempt $i -> homepage: HTTP $code"
              if [ "$code" = "200" ] || [ "$code" = "304" ]; then break; fi
              sleep 2
            done
            # health
            for i in 1 2 3; do
              hcode=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -H "User-Agent: $UA" -H "Cache-Control: no-cache" "$url/api/health" || echo "000")
              echo "Attempt $i -> /api/health: HTTP $hcode"
              if [ "$hcode" = "200" ] || [ "$hcode" = "304" ]; then break; fi
              sleep 2
            done
            if { [ "$code" = "200" ] || [ "$code" = "304" ]; } && { [ "$hcode" = "200" ] || [ "$hcode" = "304" ]; }; then
              OK_COUNT=$((OK_COUNT+1))
            fi
          done
          echo "OK targets: $OK_COUNT / ${#URLS[@]}"
          if [ $OK_COUNT -eq 0 ]; then
            echo "::warning::All keep-alive checks failed. Verify RENDER_APP_URLS (secrets/variables) and service status."
          fi

      - name: Log activity
        run: |
          echo "Keep-alive job executed at $(date -u)"
          echo "Next scheduled run in ~10 minutes (GitHub Actions cron, UTC)"